name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PAT }}

    - name: set lower case owner name
      run: |
        echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
      env:
        OWNER: '${{ github.repository_owner }}'

    - name: Set up Docker
      uses: docker/setup-docker-action@v5
      with:
        daemon-config: |
          {
            "debug": true,
            "features": {
              "containerd-snapshotter": true
            }
          }

    - uses: docker/setup-buildx-action@v4
      name: Set up Docker Buildx

    - uses: docker/build-push-action@v4
      with:
        platforms: linux/amd64
        context: .
        file: ./Dockerfile.api
        push: true
        tags: ghcr.io/${{ env.OWNER_LC }}/simulator-api:latest

    - uses: docker/build-push-action@v4
      with:
        platforms: linux/amd64
        context: .
        file: ./Dockerfile.frontend
        push: true
        tags: ghcr.io/${{ env.OWNER_LC  }}/simulator-frontend:latest

    - uses: docker/build-push-action@v4
      with:
        platforms: linux/amd64
        context: .
        file: ./Dockerfile.nginx
        push: true
        tags: ghcr.io/${{ env.OWNER_LC }}/simulator-nginx:latest

    - uses: docker/build-push-action@v4
      with:
        platforms: linux/amd64
        context: .
        file: ./Dockerfile.websocket
        push: true
        tags: ghcr.io/${{ env.OWNER_LC }}/simulator-websocket:latest

    - uses: docker/build-push-action@v4
      with:
        platforms: linux/amd64
        context: .
        file: ./Dockerfile.worker
        push: true
        tags: ghcr.io/${{ env.OWNER_LC  }}/simulator-worker:latest
